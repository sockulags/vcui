[package]
name = "vcui"
version = "0.1.0"
description = "Voice controlled UI"
edition = "2021"

[lib]
name = "vcui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
